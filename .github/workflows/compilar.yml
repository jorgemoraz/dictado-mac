name: Compilar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar el instalador
        run: bash -n instalar.sh
      - name: Pruebas
        run: |
          mkdir -p build/module-cache
          for dir in tests/*/; do
            name=$(basename "$dir")
            srcs=$(sed 's#^#src/#' "$dir/fuentes.txt" | tr '\n' ' ')
            CLANG_MODULE_CACHE_PATH=build/module-cache xcrun swiftc -swift-version 6 -target arm64-apple-macos26.0 $srcs "$dir/main.swift" -o "build/pruebas-$name"
            "./build/pruebas-$name"
          done
      - name: Compilar la app (firma ad hoc)
        run: ALLOW_ADHOC=1 zsh src/build-app.sh "$PWD/build"
